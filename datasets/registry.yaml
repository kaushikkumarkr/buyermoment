version: 1
policy: >-
  This registry records source terms and project handling decisions; it is not legal
  advice or a commercial license determination. REVIEW_REQUIRED blocks training
  weights until a human reviews the source terms and intended use.
datasets:
  - name: Amazon ESCI
    publisher: Amazon Science
    source_url: https://github.com/amazon-research/esci-code
    version_date: git revision 7916cdf6ab75a462e77f20ab40428a10923998d5
    checksum: see data/ccb1/source_manifest.json
    license: Apache-2.0; upstream LICENSE and NOTICE retained
    attribution_requirement: preserve Apache attribution and NOTICE
    training_status: TRAIN_ALLOWED
    evaluation_status: EVAL_ONLY
    commercial_review_status: REVIEW_REQUIRED
    notes: Original Exact/Substitute/Complement/Irrelevant labels are authoritative. CCB-1 currently materializes a 10,000-row slice.

  - name: Wayfair WANDS
    publisher: Wayfair
    source_url: https://github.com/wayfair/WANDS
    version_date: repository snapshot recorded in data/ccb1/source_manifest.json
    checksum: see data/ccb1/source_manifest.json
    license: MIT
    attribution_requirement: preserve MIT license and original relevance labels
    training_status: TRAIN_ALLOWED
    evaluation_status: EVAL_ONLY
    commercial_review_status: REVIEW_REQUIRED
    notes: Original Exact/Partial/Irrelevant labels are retained; Partial is not silently mapped to Exact.

  - name: Google ConvApparel V1
    publisher: Google Research
    source_url: https://huggingface.co/datasets/google/ConvApparel
    version_date: Hugging Face main release; V1 archive checksum in source manifest
    checksum: see data/ccb1/source_manifest.json
    license: CC BY 4.0 on the current dataset card; associated publication materials require verification
    attribution_requirement: preserve dataset-card attribution and citation
    training_status: REVIEW_REQUIRED
    evaluation_status: EVAL_ONLY
    commercial_review_status: REVIEW_REQUIRED
    notes: Human conversation data. V1 is present; rows are used for dialogue/recommendation evaluation, not universal relevance ground truth.

  - name: Google ConvApparel V2
    publisher: Google Research
    source_url: https://huggingface.co/datasets/google/ConvApparel
    version_date: ConvApparel_V2.zip on dataset main branch
    checksum: not downloaded
    license: CC BY 4.0 on the current dataset card; human-data and publication terms require verification
    attribution_requirement: preserve dataset-card attribution and citation
    training_status: REVIEW_REQUIRED
    evaluation_status: EVAL_ONLY
    commercial_review_status: REVIEW_REQUIRED
    notes: Available artifact is not in the current raw cache. Do not fetch or train until terms are reviewed and checksum is recorded.

